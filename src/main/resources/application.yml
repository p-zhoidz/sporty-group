spring:
  application:
    name: settlement-trigger-service
  datasource:
    url: jdbc:h2:mem:settlement;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
  h2:
    console:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      transaction-id-prefix: ${INSTANCE_ID:local}-settlement-
    consumer:
      group-id: settlement-trigger-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record

app:
  kafka:
    outcomes-topic: event-outcomes
    page-tasks-topic: settlement-page-tasks
    settlement-commands-topic: bet-settlement-commands
    outcomes-dlt-topic: event-outcomes.DLT
    page-tasks-dlt-topic: settlement-page-tasks.DLT
    settlement-commands-dlt-topic: bet-settlement-commands.DLT
    dlt-suffix: .DLT
    consumer-retry:
      interval: 1s
      max-retries: 3
    listener-enabled: true
  event-relay:
    shard-count: 16
    instance-count: ${EVENT_RELAY_INSTANCE_COUNT:1}
    instance-index: ${EVENT_RELAY_INSTANCE_INDEX:0}
    batch-size: 100
    poll-interval-ms: 500
  expansion:
    page-size: 1000
    concurrency: 4
  delivery:
    concurrency: 4
    transport: in-memory
  retry:
    delay: 5s
logging:
  level:
    com.sportygroup.settlement: INFO
